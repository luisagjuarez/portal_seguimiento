server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El límite default de nginx (1m) nunca aplicó porque el navegador le pegaba a la API en
    # otro puerto, sin pasar por acá. Ahora que este nginx la reverse-proxea, hay que dejar
    # pasar los adjuntos (tope real de 10 MB en routes_solicitudes.py).
    client_max_body_size 15m;

    location /dovela_control/api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Un solo bloque cubre raíz, /dovela_control y cualquier ruta de la SPA: si el archivo
    # pedido existe físicamente (assets/config.js/imágenes, todos bajo dovela_control/) se
    # sirve tal cual; si no, cae al index.html de dovela_control/ para que React Router
    # resuelva la ruta — funciona igual entrando por "/" que por "/dovela_control".
    # Sin el "$uri/" habitual: la raíz (/usr/share/nginx/html) existe como directorio real
    # (contiene la subcarpeta dovela_control/) pero no tiene su propio index.html ni
    # autoindex — con "$uri/" en la lista, nginx da por resuelto ese intento al encontrar el
    # directorio y devuelve 403 en vez de seguir probando el fallback siguiente.
    location / {
        try_files $uri /dovela_control/index.html;
    }
}
